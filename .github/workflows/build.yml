name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # LNB Warden is in no Maven repository and is never committed: Feed compiles against a jar built from its
      # public repository, as lnb-economy's CI does. Without it the build fails here (settings.gradle.kts).
      # Pinned to the commit Feed is built and tested against (Warden 0.5.0), so that a change to Warden can't silently
      # change what Feed is checked against. To move it: build Warden at the new commit, put its jar in apps/feed/libs,
      # check Feed with ./gradlew build, then set ref below to that commit's full hash (and lnbwarden_version_range in
      # apps/feed/gradle.properties if Feed now needs the newer Warden).
      - name: Checkout LNB Warden
        uses: actions/checkout@v4
        with:
          repository: Charles-Mahoudeau/lnb-warden
          ref: 5a9dba1f30d8eca33fcea5cacf93db29fb371d51
          path: lnb-warden

      - name: Build LNB Warden
        working-directory: lnb-warden
        run: |
          ./gradlew jar
          mkdir -p ../apps/feed/libs
          cp build/libs/lnbwarden-*.jar ../apps/feed/libs/

      # On a tag v1.2.3, every jar is built as version 1.2.3: the phone's, and Feed's, whose dependency on the phone
      # then reads [1.2.3,2) (written by the lnbphone.app plugin), so the two jars of a release load together.
      - name: Build and test
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ./gradlew build -Pmod_version="${GITHUB_REF_NAME#v}"
          else
            ./gradlew build
          fi

      - name: Upload the phone's jar
        uses: actions/upload-artifact@v4
        with:
          name: lnbphone
          path: phone/build/libs/lnbphone-*.jar
          if-no-files-found: error

      - name: Upload Feed's jar
        uses: actions/upload-artifact@v4
        with:
          name: lnbphone_feed
          path: apps/feed/build/libs/lnbphone_feed-*.jar
          if-no-files-found: error

      # The phone's jar and Feed's are published together: the demo app is built to check it compiles, never shipped.
      # LNB Warden is not ours and is not part of the release: the server installs its own copy.
      # A re-run on the same tag (a failed step, or "Re-run jobs") finds the release already there: `gh release create`
      # would fail on it, so the jars are uploaded to it instead, replacing those of the same names (the tag fixes the
      # version, so they are the same files rebuilt). The release's title and notes are left as they are.
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jars=(phone/build/libs/lnbphone-*.jar apps/feed/build/libs/lnbphone_feed-*.jar)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${jars[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${jars[@]}" --title "$GITHUB_REF_NAME" --generate-notes
          fi
