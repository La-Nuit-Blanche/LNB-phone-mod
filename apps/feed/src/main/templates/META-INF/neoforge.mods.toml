modLoader="kotlinforforge"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/La-Nuit-Blanche/LNB-phone-mod/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/La-Nuit-Blanche/LNB-phone-mod"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="kotlinforforge"
    type="required"
    versionRange="[${kff_version},)"
    ordering="NONE"
    side="BOTH"

# Player identity and the connection to LNB's site (api.url and api.token in lnbwarden-server.toml).
[[dependencies.${mod_id}]]
    modId="lnbwarden"
    type="required"
    versionRange="${lnbwarden_version_range}"
    ordering="AFTER"
    side="BOTH"

# The dependency on lnbphone is appended by the lnbphone.app plugin, with the range of the phone built against.
