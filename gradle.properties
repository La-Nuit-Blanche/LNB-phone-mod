# Shared by every mod of this repository. Each subproject's own gradle.properties holds mod_id, mod_name and
# mod_description, plus anything else its neoforge.mods.toml template uses.
mod_license=AGPL-3.0-or-later
mod_version=0.1.0
mod_group_id=fr.bde_teknantes.lnb.phone
mod_authors=Marius Pain
